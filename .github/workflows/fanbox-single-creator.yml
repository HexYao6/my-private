name: FANBOX Single Creator → PikPak

on:
  schedule:
    # 每天北京时间凌晨 3 点执行（UTC 19:00）
    - cron: '0 19 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ========== 1. 检出仓库 ==========
      - name: Checkout repository
        uses: actions/checkout@v4

      # ========== 3. 下载指定作者的内容 ==========
      - name: Download creator contents (Python)
        env:
          CREATOR_ID: ${{ secrets.CREATOR_ID }}
        run: |
          pip install requests -q
          python3 << 'PYEOF'
          import os, sys, re, json, requests, urllib.request
          from pathlib import Path
          from urllib.parse import urlparse

          creator_id = os.environ["CREATOR_ID"]
          save_dir = Path("./downloads") / creator_id
          save_dir.mkdir(parents=True, exist_ok=True)

          headers = {
              "Origin": "https://www.fanbox.cc",
              "Referer": f"https://www.fanbox.cc/@{creator_id}",
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/146.0.0.0 Safari/537.0",
          }

          def safe_name(name):
              """清理文件名中的非法字符"""
              return re.sub(r'[\\/*?:"<>|]', "_", name).strip() or "untitled"

          def download_file(url, filepath):
              """带重试的下载"""
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=60) as resp:
                          filepath.write_bytes(resp.read())
                      return True
                  except Exception as e:
                      print(f"    ⚠️ 重试 {attempt+1}/3: {e}")
              return False

          # ========== 获取帖子列表 ==========
          print(f"🔍 获取作者 {creator_id} 的帖子列表...")
          url = f"https://api.fanbox.cc/post.listCreator?creatorId={creator_id}&limit=100"
          resp = requests.get(url, headers=headers, timeout=30)
          resp.raise_for_status()
          data = resp.json()

          items = data.get("body", {}).get("items", [])
          if not items:
              print("⚠️ 未找到任何帖子")
              sys.exit(0)

          print(f"📋 找到 {len(items)} 个帖子\n")

          total_images = 0
          total_files = 0

          for item in items:
              post_id = item["id"]
              post_title = safe_name(item.get("title", "no_title"))
              post_dir = save_dir / f"{post_id}_{post_title[:60]}"
              post_dir.mkdir(exist_ok=True)

              print(f"📝 [{post_id}] {post_title[:50]}")

              body = item.get("body") or {}

              # 处理旧格式：body 可能是字符串
              if isinstance(body, str):
                  (post_dir / "content.txt").write_text(body, encoding="utf-8")
                  continue

              # 保存文本
              text = body.get("text", "")
              if text:
                  (post_dir / "content.txt").write_text(text, encoding="utf-8")

              # 下载图片
              images = body.get("images", []) or []
              for i, img in enumerate(images):
                  img_url = img.get("originalUrl") or img.get("url")
                  if not img_url:
                      continue
                  ext = Path(urlparse(img_url).path).suffix or ".png"
                  filename = post_dir / f"img_{i+1:03d}{ext}"
                  if filename.exists():
                      print(f"   ⏭️ 跳过图片: {filename.name}")
                      continue
                  print(f"   ⬇️ 图片: {filename.name}")
                  if download_file(img_url, filename):
                      total_images += 1

              # 下载附件
              files = body.get("files", []) or []
              for f in files:
                  file_url = f.get("url")
                  file_name = safe_name(f.get("name", "file"))
                  if not file_url:
                      continue
                  ext = Path(file_name).suffix or ""
                  filename = post_dir / f"file_{file_name}"
                  if filename.exists():
                      print(f"   ⏭️ 跳过附件: {filename.name}")
                      continue
                  print(f"   ⬇️ 附件: {filename.name}")
                  if download_file(file_url, filename):
                      total_files += 1

              # 下载封面图
              cover = item.get("coverImageUrl")
              if cover:
                  ext = Path(urlparse(cover).path).suffix or ".jpg"
                  filename = post_dir / f"cover{ext}"
                  if not filename.exists():
                      print(f"   ⬇️ 封面: cover{ext}")
                      download_file(cover, filename)

          print(f"\n✅ 下载完成")
          print(f"   图片: {total_images} 张")
          print(f"   附件: {total_files} 个")
          PYEOF

      # ========== 4. 安装 rclone ==========
      - name: Install rclone
        run: |
          curl -s https://rclone.org/install.sh | sudo bash
          echo "✅ rclone 安装完成:"
          rclone version

      # ========== 5. 还原 rclone 配置 ==========
      - name: Setup rclone config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG" | base64 -d > ~/.config/rclone/rclone.conf
          
          echo "✅ rclone 配置已还原:"
          rclone listremotes
          
          echo "🔍 测试 PikPak 连接..."
          rclone ls "pikpak_remote:" --max-depth 1

      # ========== 6. 上传到 PikPak ==========
      - name: Upload to PikPak
        env:
          CREATOR_ID: ${{ secrets.CREATOR_ID }}
        run: |
          DATE=$(date +%Y-%m-%d)
          TARGET="pikpak_remote:FANBOX-Backup/${CREATOR_ID}/${DATE}"
          
          echo ""
          echo "☁️ 开始上传到 ${TARGET} ..."
          
          rclone copy ./downloads "${TARGET}" \
            --progress \
            --transfers 4 \
            --checkers 8 \
            --exclude ".git/**" \
            --stats-one-line \
            --stats 10s
          
          echo ""
          echo "✅ 上传完成: ${TARGET}"
          
          UPLOAD_COUNT=$(rclone ls "${TARGET}" | wc -l)
          echo "📁 已上传文件数: $UPLOAD_COUNT"

      # ========== 7. 可选：Telegram 通知 ==========
      - name: Send Telegram notification
        if: always() && env.TG_BOT_TOKEN != ''
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          CREATOR_ID: ${{ secrets.CREATOR_ID }}
        run: |
          STATUS="${{ job.status }}"
          DATE=$(date +%Y-%m-%d")
          
          if [ "$STATUS" == "success" ]; then
            MSG="✅ FANBOX 备份成功%0A👤 作者: ${CREATOR_ID}%0A📅 ${DATE}%0A☁️ 路径: FANBOX-Backup/${CREATOR_ID}/${DATE}"
          else
            MSG="❌ FANBOX 备份失败%0A👤 作者: ${CREATOR_ID}%0A📅 ${DATE}%0A🔧 请检查 Actions 日志"
          fi
          
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML" || true

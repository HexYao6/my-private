name: FANBOX Single Creator → PikPak (Fixed)

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ========== 编译修复版 fanbox-dl ==========
      - name: Build fixed fanbox-dl
        run: |
          echo "🔧 安装 Go 环境..."
          sudo apt-get update -qq && sudo apt-get install -y -qq golang-go > /dev/null 2>&1
          go version
          
          echo "⬇️ 克隆修复版 fork..."
          git clone --branch xianoem/fix-fanbox-api-response-envelopes --depth 1 https://github.com/xianoem/fanbox-dl.git /tmp/fanbox-dl
          
          echo "🔨 编译 fanbox-dl..."
          cd /tmp/fanbox-dl
          go build -o /usr/local/bin/fanbox-dl ./cmd/fanbox-dl
          
          echo "✅ 编译完成:"
          fanbox-dl --version

      # ========== 下载内容 ==========
      - name: Download creator contents
        env:
          FANBOX_SESSID: ${{ secrets.FANBOX_SESSID }}
          CREATOR_ID: ${{ secrets.CREATOR_ID }}
        run: |
          mkdir -p ./downloads
          
          echo "⬇️ 开始下载作者: $CREATOR_ID"
          fanbox-dl \
            --creator "$CREATOR_ID" \
            --save-dir ./downloads \
            --dir-by-post \
            --skip-on-error \
            --verbose

      # ========== rclone 配置 & 上传 ==========
      - name: Install rclone
        run: |
          curl -s https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Setup rclone config
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          rclone listremotes
          rclone ls "pikpak_remote:" --max-depth 1

      - name: Upload to PikPak
        env:
          CREATOR_ID: ${{ secrets.CREATOR_ID }}
        run: |
          DATE=$(date +%Y-%m-%d)
          TARGET="pikpak_remote:FANBOX-Backup/${CREATOR_ID}/${DATE}"
          echo "☁️ 上传到 ${TARGET} ..."
          rclone copy ./downloads "${TARGET}" \
            --progress \
            --transfers 4 \
            --checkers 8 \
            --stats-one-line \
            --stats 10s
          echo "✅ 上传完成"

      - name: Send Telegram notification
        if: always() && env.TG_BOT_TOKEN != ''
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          CREATOR_ID: ${{ secrets.CREATOR_ID }}
        run: |
          STATUS="${{ job.status }}"
          DATE=$(date +%Y-%m-%d)
          if [ "$STATUS" == "success" ]; then
            MSG="✅ FANBOX → PikPak 备份成功%0A👤 作者: ${CREATOR_ID}%0A📅 ${DATE}"
          else
            MSG="❌ FANBOX → PikPak 备份失败%0A👤 作者: ${CREATOR_ID}%0A📅 ${DATE}"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "text=${MSG}" || true

name: FANBOX Single Creator → PikPak

on:
  schedule:
    # 每天北京时间凌晨 3 点执行（UTC 19:00）
    - cron: '0 19 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ========== 1. 检出仓库 ==========
      - name: Checkout repository
        uses: actions/checkout@v4

      # ========== 3. 下载指定作者的内容 ==========
      - name: Download creator contents (Python)
        env:
          CREATOR_ID: ${{ secrets.CREATOR_ID }}
        run: |
          pip install requests -q
          python3 << 'EOF'
          import os, requests, json, urllib.request
          from pathlib import Path

          creator_id = os.environ["CREATOR_ID"]
          save_dir = Path("./downloads") / creator_id
          save_dir.mkdir(parents=True, exist_ok=True)

          headers = {
              "Origin": "https://www.fanbox.cc",
              "Referer": f"https://www.fanbox.cc/@{creator_id}",
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
          }

          # 获取帖子列表
          url = f"https://api.fanbox.cc/post.listCreator?creatorId={creator_id}&limit=100"
          resp = requests.get(url, headers=headers)
          resp.raise_for_status()
          data = resp.json()

          items = data.get("body", {}).get("items", [])
          print(f"📋 找到 {len(items)} 个帖子")

          for item in items:
              post_id = item["id"]
              post_title = item["title"]
              post_dir = save_dir / f"{post_id}_{post_title[:50]}"
              post_dir.mkdir(exist_ok=True)

              # 下载图片
              images = item.get("body", {}).get("images", [])
              for i, img in enumerate(images):
                  img_url = img["originalUrl"]
                  ext = img_url.split(".")[-1].split("?")[0]
                  filename = post_dir / f"{i+1:03d}.{ext}"
                  if filename.exists():
                      print(f"  ⏭️ 跳过已存在: {filename.name}")
                      continue
                  print(f"  ⬇️ 下载: {filename.name}")
                  urllib.request.urlretrieve(img_url, filename)

              # 下载文件附件
              files = item.get("body", {}).get("files", [])
              for f in files:
                  file_url = f["url"]
                  filename = post_dir / f["file_{f['name']}"
                  if filename.exists():
                      continue
                  print(f"  ⬇️ 下载附件: {filename.name}")
                  urllib.request.urlretrieve(file_url, filename)

              # 保存文本内容
              text = item.get("body", {}).get("text", "")
              if text:
                  (post_dir / "content.txt").write_text(text, encoding="utf-8")

          print("✅ 下载完成")
          EOF

      # ========== 4. 安装 rclone ==========
      - name: Install rclone
        run: |
          curl -s https://rclone.org/install.sh | sudo bash
          echo "✅ rclone 安装完成:"
          rclone version

      # ========== 5. 还原 rclone 配置 ==========
      - name: Setup rclone config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG" | base64 -d > ~/.config/rclone/rclone.conf
          
          echo "✅ rclone 配置已还原:"
          rclone listremotes
          
          echo "🔍 测试 PikPak 连接..."
          rclone ls "pikpak_remote:" --max-depth 1

      # ========== 6. 上传到 PikPak ==========
      - name: Upload to PikPak
        env:
          CREATOR_ID: ${{ secrets.CREATOR_ID }}
        run: |
          DATE=$(date +%Y-%m-%d)
          TARGET="pikpak_remote:FANBOX-Backup/${CREATOR_ID}/${DATE}"
          
          echo ""
          echo "☁️ 开始上传到 ${TARGET} ..."
          
          rclone copy ./downloads "${TARGET}" \
            --progress \
            --transfers 4 \
            --checkers 8 \
            --exclude ".git/**" \
            --stats-one-line \
            --stats 10s
          
          echo ""
          echo "✅ 上传完成: ${TARGET}"
          
          UPLOAD_COUNT=$(rclone ls "${TARGET}" | wc -l)
          echo "📁 已上传文件数: $UPLOAD_COUNT"

      # ========== 7. 可选：Telegram 通知 ==========
      - name: Send Telegram notification
        if: always() && env.TG_BOT_TOKEN != ''
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          CREATOR_ID: ${{ secrets.CREATOR_ID }}
        run: |
          STATUS="${{ job.status }}"
          DATE=$(date +%Y-%m-%d")
          
          if [ "$STATUS" == "success" ]; then
            MSG="✅ FANBOX 备份成功%0A👤 作者: ${CREATOR_ID}%0A📅 ${DATE}%0A☁️ 路径: FANBOX-Backup/${CREATOR_ID}/${DATE}"
          else
            MSG="❌ FANBOX 备份失败%0A👤 作者: ${CREATOR_ID}%0A📅 ${DATE}%0A🔧 请检查 Actions 日志"
          fi
          
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML" || true

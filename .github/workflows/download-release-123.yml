name: GitHub Release → 123pan

on:
  workflow_dispatch:
    inputs:
      repository:
        description: '源仓库 (owner/repo)'
        required: false
        default: 'babalae/better-genshin-impact'
      tag:
        description: 'Release tag (例如 v1.0.0)，留空则下载 latest'
        required: false
        default: ''
      pattern:
        description: '仅下载匹配的文件 (例如 *.zip)，留空下载全部'
        required: false
        default: ''

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve inputs
        id: vars
        run: |
          REPO="${{ github.event.inputs.repository }}"
          if [ -z "$REPO" ]; then
            REPO="${{ github.repository }}"
          fi
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "pattern=${{ github.event.inputs.pattern }}" >> "$GITHUB_OUTPUT"
          echo "ℹ️ 目标仓库: $REPO"

      # ========== 下载 Release 附件 ==========
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ steps.vars.outputs.repo }}"
          TAG="${{ steps.vars.outputs.tag }}"
          PATTERN="${{ steps.vars.outputs.pattern }}"

          mkdir -p ./downloads

          echo "⬇️ 下载 Release: ${REPO} @ ${TAG:-latest}"
          ARGS=(--repo "$REPO" --dir ./downloads --clobber)
          if [ -n "$TAG" ]; then
            ARGS+=("$TAG")
          fi
          if [ -n "$PATTERN" ]; then
            ARGS+=(--pattern "$PATTERN")
          fi

          gh release download "${ARGS[@]}"
          echo "✅ 下载完成:"
          ls -lah ./downloads

      # ========== 123pan 单文件 1GB 限制预检 ==========
      - name: Check file sizes (123pan WebDAV 1GB limit)
        run: |
          OVER=$(find ./downloads -type f -size +950M -print)
          if [ -n "$OVER" ]; then
            echo "❌ 以下文件超过 123pan WebDAV 单文件 1GB 限制:"
            echo "$OVER"
            exit 1
          fi
          echo "✅ 文件大小预检通过"

      # ========== rclone 配置 & 上传 ==========
      - name: Install rclone
        run: |
          curl -s https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Setup rclone config
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          rclone listremotes
          rclone lsd "123pan_remote:" || echo "⚠️ 根目录列举失败，但不阻断流程"

      - name: Upload to 123pan
        run: |
          REPO="${{ steps.vars.outputs.repo }}"
          TAG="${{ steps.vars.outputs.tag }}"
          TAG="${TAG:-latest}"
          SAFE_TAG=$(echo "$TAG" | tr ' /:*?"<>|' '_')

          TARGET="123pan_remote:GitHub-Releases/${REPO}/${SAFE_TAG}"
          echo "☁️ 上传到 ${TARGET} ..."
          rclone copy ./downloads "${TARGET}" \
            --transfers 2 \
            --checkers 4 \
            --retries 3 \
            --low-level-retries 5 \
            --progress \
            --stats 10s
          echo "✅ 上传完成"
